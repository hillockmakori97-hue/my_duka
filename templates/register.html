{% extends 'base.html' %}
{% block title %} Register - MyDuka {% endblock %}

{% block content %}
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<div class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-5 px-3">
    <div class="container">
        <div class="row justify-content-center">
            <!-- Increased width container -->
            <div class="col-12 col-md-10 col-lg-8 col-xl-6">

                <!-- Registration Card Container -->
                <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden p-4 p-md-5">

                    <!-- Card Header -->
                    <div class="text-center mb-4">
                        <!-- AFTER -->
                        <div class="bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                            style="width: 72px; height: 72px;">
                            <i class="bi bi-person-plus-fill fs-3"></i>
                        </div>
                        <h3 class="fw-bold text-dark mb-1">Create Account</h3>
                        <p class="text-secondary small mb-0">Join MyDuka to start managing your store</p>
                    </div>

                    <!-- Registration Form -->
                    <form action="/register" method="post">

                        <!-- 2-Column Grid for Form Fields -->
                        <div class="row g-3 mb-3">
                            <!-- Full Name -->
                            <div class="col-12 col-md-6">
                                <label for="fullName" class="form-label fw-semibold small text-secondary">FULL
                                    NAME</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i
                                            class="bi bi-person"></i></span>
                                    <input type="text" name="full_name"
                                        class="form-control bg-light border-start-0 ps-0 fs-6" id="fullName"
                                        placeholder="John Doe" required>
                                </div>
                            </div>

                            <!-- Email Address -->
                            <div class="col-12 col-md-6">
                                <label for="emailAddress" class="form-label fw-semibold small text-secondary">EMAIL
                                    ADDRESS</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i
                                            class="bi bi-envelope"></i></span>
                                    <input type="email" name="email"
                                        class="form-control bg-light border-start-0 ps-0 fs-6" id="emailAddress"
                                        placeholder="name@example.com" required>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <!-- Phone Number -->
                            <div class="col-12 col-md-6">
                                <label for="phoneNumber" class="form-label fw-semibold small text-secondary">PHONE
                                    NUMBER</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i
                                            class="bi bi-telephone"></i></span>
                                    <input type="tel" name="phone_no"
                                        class="form-control bg-light border-start-0 ps-0 fs-6" id="phoneNumber"
                                        placeholder="+254 700 000000" required>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="col-12 col-md-6">
                                <label for="userPassword"
                                    class="form-label fw-semibold small text-secondary">PASSWORD</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i
                                            class="bi bi-lock"></i></span>
                                    <input type="password" name="password"
                                        class="form-control bg-light border-start-0 ps-0 fs-6" id="userPassword"
                                        placeholder="••••••••" required>
                                </div>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit"
                            class="btn btn-primary w-100 rounded-pill py-2.5 fw-semibold shadow-sm mb-3">
                            Register Account
                        </button>

                    </form>

                    <!-- Footer Redirect Link -->
                    <div class="text-center mt-3 pt-3 border-top">
                        <p class="text-secondary small mb-0">Already have an account?
                            <a href="/login" class="text-primary fw-semibold text-decoration-none">Sign In</a>
                        </p>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
