{%extends 'base.html' %}
{%block title%}Stock{%endblock%}
{%block content%}
<div>
    <h1>products</h1>
    <div>
        <table id="example" class="table table-striped">
            <thead>
                <tr>
                    <th>id</th>
                    <th>Pid</th>
                    <th>Stock_quantity</th>
                    <th>Created-at</th>

                </tr>
            </thead>
            <tbody>
                {% for i in stock_data %}
                <tr>
                    <td>{{ i[0] }}</td>
                    <td>{{ i[1] }}</td>
                    <td>{{ i[2] }}</td>
                    <td>{{ i[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div>
        <form action='/add_stock' method="post">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Product_id </label>
                <input type="text" name="product_id" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text"></div>
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Stock Quantity</label>
                <input type="number" name="stock_quantity" class="form-control" id="exampleInputPassword1">
            </div>
            <button type="submit" class="btn btn-primary">Add Product</button>
        </form>
    </div>
</div>
{%endblock%}
