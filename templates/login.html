{% extends 'base.html' %}
{% block title %} Login - MyDuka {% endblock %}

{% block content %}
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<div class="bg-light min-vh-100 d-flex align-items-center justify-content-center py-5 px-3">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                
                <!-- Login Card Container -->
                <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden p-4 p-md-5">
                    
                    <!-- Card Header -->
                    <div class="text-center mb-4">
                        <div class="bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 72px; height: 72px;">
                            <i class="bi bi-shield-lock-fill fs-3"></i>
                        </div>
                        <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
                        <p class="text-secondary small mb-0">Sign in to your MyDuka account</p>
                    </div>

                    <!-- Login Form -->
                    <form action="/login" method="post">
                        
                        <!-- Email Address Field -->
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label fw-semibold small text-secondary">EMAIL ADDRESS</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control bg-light border-start-0 ps-0 fs-6" id="exampleInputEmail1" placeholder="name@example.com" aria-describedby="emailHelp" required>
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label fw-semibold small text-secondary">PASSWORD</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control bg-light border-start-0 ps-0 fs-6" id="exampleInputPassword1" placeholder="••••••••" required>
                            </div>
                        </div>

                        <!-- Remember Me Options -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                                <label class="form-check-label small text-secondary" for="exampleCheck1">Remember me</label>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2.5 fw-semibold shadow-sm mb-3">
                            Sign In
                        </button>

                    </form>

                    <!-- Footer Redirect Link -->
                    <div class="text-center mt-3 pt-3 border-top">
                        <p class="text-secondary small mb-0">Don't have an account? 
                            <a href="/register" class="text-primary fw-semibold text-decoration-none">Create Account</a>
                        </p>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
